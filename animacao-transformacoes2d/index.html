<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Transformações e suas Matrizes</title>

<style>
    body {
        margin: 0;
        background-color: #071b34;
        color: white;

        font-family: Georgia, serif;

        display: flex;
        justify-content: center;
    }


    /* ========================================
    TABELA
    ======================================== */

    table {
        border-spacing: 20px 0;
    }

    td {
        text-align: center;
        vertical-align: top;
    }

    /* ========================================
    INFORMAÇÕES
    ======================================== */

    .informacoes {
        text-align: center;
        margin: 20px;
    }

    .titulo {
        text-align: center;
        font-size: 20px;
        margin: 20px;
    }

    .formula {
        text-align: center;
        font-size: 20px;
        margin: 20px;
    }

    .matriz {
        text-align: center;
        font-size: 20px;
        margin: 20px;
    }


    /* ========================================
    CANVAS
    ======================================== */

    canvas {
        width: 400px;
        height: 400px;
        background-color: black;
    }


    /* ========================================
    VALORES
    ======================================== */

    .parametros {
        font-size: 20px;
        margin-top: 20px;
        margin-bottom: 30px;
    }
</style>
</head>

<body>

<table>

    <tr>

        <!-- ================= TRANSLAÇÃO ================= -->

        <td>

            <div class="informacoes">

                <div class="titulo">
                    Translação
                </div>

                <div class="formula">

                    <math>
                        <mo>[</mo>

                        <mtable>
                            <mtr>
                                <mtd>x'</mtd>
                            </mtr>
                            <mtr>
                                <mtd>y'</mtd>
                            </mtr>
                            <mtr>
                                <mtd>1</mtd>
                            </mtr>
                        </mtable>

                        <mo>]</mo>

                        <mo>=</mo>

                        <mo>[</mo>

                        <mtable>
                            <mtr>
                                <mtd>1</mtd>
                                <mtd>0</mtd>
                                <mtd>tx</mtd>
                            </mtr>

                            <mtr>
                                <mtd>0</mtd>
                                <mtd>1</mtd>
                                <mtd>ty</mtd>
                            </mtr>

                            <mtr>
                                <mtd>0</mtd>
                                <mtd>0</mtd>
                                <mtd>1</mtd>
                            </mtr>
                        </mtable>

                        <mo>]</mo>

                        <mo>[</mo>

                        <mtable>
                            <mtr>
                                <mtd>x</mtd>
                            </mtr>
                            <mtr>
                                <mtd>y</mtd>
                            </mtr>
                            <mtr>
                                <mtd>1</mtd>
                            </mtr>
                        </mtable>

                        <mo>]</mo>

                    </math>

                </div>


                <!-- MATRIZ DINÂMICA -->

                <div class="matriz">

                    <math>
                        <mo>[</mo>

                        <mtable>
                            <mtr>
                                <mtd id="trans00">1</mtd>
                                <mtd id="trans01">0</mtd>
                                <mtd id="trans02">0</mtd>
                            </mtr>

                            <mtr>
                                <mtd id="trans10">0</mtd>
                                <mtd id="trans11">1</mtd>
                                <mtd id="trans12">0</mtd>
                            </mtr>

                            <mtr>
                                <mtd id="trans20">0</mtd>
                                <mtd id="trans21">0</mtd>
                                <mtd id="trans22">1</mtd>
                            </mtr>
                        </mtable>

                        <mo>]</mo>
                    </math>

                </div>


                <canvas
                    id="canvas-translacao"
                    width="400"
                    height="400">
                </canvas>


                <div class="parametros">
                    tx = <span id="valorTx">0</span>
                    <br>
                    ty = <span id="valorTy">0</span>
                </div>

            </div>

        </td>


        <!-- ================= ROTAÇÃO ================= -->

        <td>

            <div class="informacoes">

                <div class="titulo">
                    Rotação
                </div>

                <div class="formula">

                    <math>
                    <mo>[</mo>

                    <mtable>
                        <mtr>
                            <mtd>x'</mtd>
                        </mtr>

                        <mtr>
                            <mtd>y'</mtd>
                        </mtr>

                        <mtr>
                            <mtd>1</mtd>
                        </mtr>
                    </mtable>

                    <mo>]</mo>
                    <mo>=</mo>
                    <mo>[</mo>
                    <mtable>
                        <mtr>
                            <mtd>cos θ</mtd>
                            <mtd>−sin θ</mtd>
                            <mtd>0</mtd>
                        </mtr>

                        <mtr>
                            <mtd>sin θ</mtd>
                            <mtd>cos θ</mtd>
                            <mtd>0</mtd>
                        </mtr>

                        <mtr>
                            <mtd>0</mtd>
                            <mtd>0</mtd>
                            <mtd>1</mtd>
                        </mtr>
                    </mtable>
                    <mo>]</mo>
                    <mo>[</mo>
                    <mtable>
                        <mtr>
                            <mtd>x</mtd>
                        </mtr>

                        <mtr>
                            <mtd>y</mtd>
                        </mtr>

                        <mtr>
                            <mtd>1</mtd>
                        </mtr>
                    </mtable>
                    <mo>]</mo>
                    </math> 
                </div>


                <div class="matriz">

                    <math>
                        <mo>[</mo>

                        <mtable>
                            <mtr>
                                <mtd id="rot00">1</mtd>
                                <mtd id="rot01">0</mtd>
                                <mtd id="rot02">0</mtd>
                            </mtr>

                            <mtr>
                                <mtd id="rot10">0</mtd>
                                <mtd id="rot11">1</mtd>
                                <mtd id="rot12">0</mtd>
                            </mtr>

                            <mtr>
                                <mtd id="rot20">0</mtd>
                                <mtd id="rot21">0</mtd>
                                <mtd id="rot22">1</mtd>
                            </mtr>
                        </mtable>

                        <mo>]</mo>
                    </math>

                </div>


                <canvas
                    id="canvas-rotacao"
                    width="400"
                    height="400">
                </canvas>


                <div class="parametros">
                    θ = <span id="valorAngulo">0</span>°
                </div>

            </div>

        </td>


        <!-- ================= ESCALA ================= -->

        <td>

            <div class="informacoes">

                <div class="titulo">
                    Escala
                </div>

                <div class="formula">
                    <math>
                    <mo>[</mo>

                    <mtable>
                        <mtr>
                            <mtd id="m00">x'</mtd>
                        </mtr>

                        <mtr>
                            <mtd id="m10">y'</mtd>
                        </mtr>

                        <mtr>
                            <mtd id="m20">1</mtd>
                        </mtr>
                    </mtable>

                    <mo>]</mo>
                    <mo>=</mo>
                    <mo>[</mo>

                    <mtable>
                        <mtr>
                            <mtd id="m00">sx</mtd>
                            <mtd id="m01">0</mtd>
                            <mtd id="m02">0</mtd>
                        </mtr>

                        <mtr>
                            <mtd id="m10">0</mtd>
                            <mtd id="m11">sy</mtd>
                            <mtd id="m12">0</mtd>
                        </mtr>

                        <mtr>
                            <mtd id="m20">0</mtd>
                            <mtd id="m21">0</mtd>
                            <mtd id="m22">1</mtd>
                        </mtr>
                    </mtable>

                    <mo>]</mo>
                    <mo>[</mo>

                    <mtable>
                        <mtr>
                            <mtd id="m00">x</mtd>
                        </mtr>

                        <mtr>
                            <mtd id="m10">y</mtd>
                        </mtr>

                        <mtr>
                            <mtd id="m20">1</mtd>
                        </mtr>
                    </mtable>

                    <mo>]</mo>
                    </math>

                </div>


                <div class="matriz">

                    <math>

                        <mo>[</mo>

                        <mtable>
                            <mtr>
                                <mtd id="esc00">1</mtd>
                                <mtd id="esc01">0</mtd>
                                <mtd id="esc02">0</mtd>
                            </mtr>

                            <mtr>
                                <mtd id="esc10">0</mtd>
                                <mtd id="esc11">1</mtd>
                                <mtd id="esc12">0</mtd>
                            </mtr>

                            <mtr>
                                <mtd id="esc20">0</mtd>
                                <mtd id="esc21">0</mtd>
                                <mtd id="esc22">1</mtd>
                            </mtr>
                        </mtable>

                        <mo>]</mo>
                    </math>

                </div>


                <canvas
                    id="canvas-escala"
                    width="400"
                    height="400">
                </canvas>


                <div class="parametros">
                    sx = <span id="valorSx">1</span>
                    <br>
                    sy = <span id="valorSy">1</span>
                </div>

            </div>

        </td>

    </tr>

</table>

<script src="m3.js"></script>
<script src="main.js"></script>

</body>

</html>
